# Development container (its own network namespace, with the veth pair F-Stack
# uses set up by entrypoint.sh):
#   docker compose up -d
#   docker compose exec teto-dpdk bash     # as many shells as you need
#   docker compose down
# To run the test suite, use scripts/test.sh.
services:
  teto-dpdk:
    build: .
    # F-Stack's arm64 support is incomplete: run as x86_64 (emulated on
    # Apple Silicon).
    platform: linux/amd64
    # Its own network namespace (never `network_mode: host`): entrypoint.sh
    # creates the veth pair F-Stack uses inside it.
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"
    environment:
      CARGO_TARGET_DIR: /app/target/docker
    volumes:
      - .:/app
      - teto-cargo-registry:/root/.cargo/registry
    command: sleep infinity

volumes:
  teto-cargo-registry:
