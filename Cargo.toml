[workspace]
members = ["teto-tokio"]

[package]
name = "teto-dpdk"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Mehve Labs <mehvelabs@gmail.com>"]
description = "Rust bindings for F-Stack — high-performance userspace TCP/UDP via DPDK, bypassing the Linux kernel network stack entirely."
license = "Apache-2.0"
repository = "https://github.com/mehve-labs/teto-dpdk"
homepage = "https://github.com/mehve-labs/teto-dpdk"
documentation = "https://docs.rs/teto-dpdk"
keywords = ["dpdk", "fstack", "networking", "userspace", "tcp"]
categories = ["network-programming", "asynchronous", "external-ffi-bindings"]
readme = "README.md"
links = "fstack"
# Explicit, so the package doesn't depend on the publisher's gitignore. The
# Docker and CI tooling stays in the repository.
include = [
    "src/**",
    "cxx_layer/**",
    "build.rs",
    "examples/**",
    "config.ini",
    "docs/*.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[dependencies]
cxx = "1.0.194"

[build-dependencies]
cxx-build = "1.0.194"
pkg-config = "0.3.32"
